name: Update PROT stock price

on:
  schedule:
    - cron: '30 16 * * 1-5'  # 16:30 UTC = after Oslo Børs closes (Mon–Fri)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PROT.OL price from Yahoo Finance
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.parse, json, datetime

          headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          }

          # Step 1: get session cookies
          req = urllib.request.Request('https://fc.yahoo.com', headers=headers)
          try:
            resp = urllib.request.urlopen(req, timeout=10)
            raw = resp.headers.get('Set-Cookie', '')
            cookies = '; '.join(c.split(';')[0].strip() for c in raw.split(',') if c.strip())
          except Exception as e:
            print(f'Cookie fetch failed: {e}')
            cookies = ''

          # Step 2: get crumb
          headers2 = {**headers, 'Cookie': cookies}
          req2 = urllib.request.Request('https://query2.finance.yahoo.com/v1/test/getcrumb', headers=headers2)
          try:
            crumb = urllib.request.urlopen(req2, timeout=10).read().decode()
          except Exception as e:
            print(f'Crumb fetch failed: {e}')
            crumb = ''

          # Step 3: fetch chart data
          url = f'https://query1.finance.yahoo.com/v8/finance/chart/PROT.OL?interval=1d&range=2d&crumb={urllib.parse.quote(crumb)}'
          req3 = urllib.request.Request(url, headers=headers2)
          data = json.loads(urllib.request.urlopen(req3, timeout=10).read())

          meta = data['chart']['result'][0]['meta']
          price = meta['regularMarketPrice']
          prev  = meta.get('chartPreviousClose') or meta.get('previousClose') or price
          change     = round(price - prev, 1)
          change_pct = round((change / prev) * 100, 2) if prev else 0
          today = datetime.date.today().isoformat()

          out = {'price': round(price, 1), 'change': change, 'changePct': change_pct, 'updated': today}
          with open('static/prot-price.json', 'w') as f:
            json.dump(out, f)
          print(f"Saved: NOK {price:.1f}  {change_pct:+.2f}%  ({today})")
          EOF

      - name: Commit updated price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/prot-price.json
          git diff --staged --quiet || git commit -m "chore: update PROT price $(date +%Y-%m-%d) [skip ci]"
          git push
