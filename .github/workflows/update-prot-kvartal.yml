name: Update PROT quarterly figures

on:
  schedule:
    - cron: '0 6 * * 1-5'  # 06:00 UTC på hverdager – fanger nye kvartalsrapporter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kvartal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch PROT quarterly figures from Oslo Børs NewsWeb
        run: node scripts/fetch-prot-kvartal.mjs static

      - name: Commit updated quarterly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/prot-kvartal.json
          git diff --staged --quiet || git commit -m "chore: update PROT quarterly figures $(date +%Y-%m-%d) [skip ci]"
          git push
