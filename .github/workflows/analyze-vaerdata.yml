name: Analyze vaerdata (LLM, optional)

# HVILENDE / VALGFRITT. Denne jobben koster tokens og er derfor bevisst IKKE
# tidsstyrt ennå. For å aktivere ukentlig kjøring:
#   1) Legg til repo-secret ANTHROPIC_API_KEY (Settings → Secrets → Actions).
#   2) Fjern kommentaren på schedule-blokken under.
# Uten secret er scripts/analyze-vaerdata.mjs uansett hvilende (skriver ingen fil,
# koster ingen tokens), så selv en aktivert schedule er trygg før nøkkelen finnes.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 1 * * 0'   # søndag 01:00 UTC — ukentlig LLM-tolkning av treffsikkerheten

permissions:
  contents: write

jobs:
  analyze-vaerdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate weekly narrative (dormant without ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analyze-vaerdata.mjs static

      - name: Commit narrative
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/vaerdata/data/accuracy/bergen_gk-narrative.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: vaerdata narrative $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)
