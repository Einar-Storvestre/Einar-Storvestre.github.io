name: Update PROT valuation history

on:
  schedule:
    - cron: '30 16 * * 1-5'  # etter Oslo Børs-stengning, hverdager
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append-valuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Append today's PROT valuation point
        run: node scripts/append-valuation.mjs static

      - name: Commit updated valuation history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/prot-valuation-history.json
          git diff --staged --quiet || git commit -m "chore: append PROT valuation point $(date +%Y-%m-%d) [skip ci]"
          git push
