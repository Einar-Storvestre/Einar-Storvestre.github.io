title: Einar Storvestre
baseURL: https://einar-storvestre.github.io/
defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 20
enableEmoji: false
enableRobotsTXT: true
disableAliases: true
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]
imaging:
  resampleFilter: lanczos
  quality: 88
  anchor: smart
timeout: 600000
taxonomies:
  author: authors
  tag: tags
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    guessSyntax: true
