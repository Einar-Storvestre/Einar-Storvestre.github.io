<text x="116" y="499" font-family="Arial, sans-serif" font-size="34" fill="#f6f8fb" font-weight="700">Time it</text>
<text x="116" y="549" font-family="Arial, sans-serif" font-size="23" fill="#bac8da" font-weight="400">A recurring interval</text>
<path d="M418 495h24m-2-9 10 9-10 9" fill="none" stroke="#f0a99a" stroke-width="3"/>
