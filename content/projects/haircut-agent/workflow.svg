<text x="484" y="499" font-family="Arial, sans-serif" font-size="34" fill="#f6f8fb" font-weight="700">Suggest</text>
<text x="484" y="549" font-family="Arial, sans-serif" font-size="23" fill="#bac8da" font-weight="400">Slots and calendar</text>
