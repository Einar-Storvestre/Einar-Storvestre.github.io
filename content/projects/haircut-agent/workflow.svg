<text x="852" y="499" font-family="Arial, sans-serif" font-size="34" fill="#f6f8fb" font-weight="700">Confirm</text>
<text x="852" y="549" font-family="Arial, sans-serif" font-size="23" fill="#bac8da" font-weight="400">An offered time</text>
